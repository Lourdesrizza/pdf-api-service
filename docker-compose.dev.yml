# Override de desarrollo: usar junto con docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Solo publica la API en 127.0.0.1:8002. Las URLs de extractor y documentos salen
# de EXTRACTOR_URL y DOCUMENT_SERVICE_URL (ver .env.example); los servicios reales
# los levanta el compose de integración de pdf-infrastructure.
services:
  api:
    ports:
      - "127.0.0.1:8002:8000"