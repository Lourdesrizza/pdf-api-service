# Override de desarrollo: usar SIEMPRE junto con docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      EXTRACTOR_URL: http://extractor:8000
      DOCUMENT_SERVICE_URL: http://documents:8000
    depends_on:
      - extractor
      - documents
  extractor:
    image: pdf-extractor-service:0.1.0
    networks:
      - pdf-network
  documents:
    build:
      context: tests/fakes
    networks:
      - pdf-network
