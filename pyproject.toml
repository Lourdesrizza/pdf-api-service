[project]
name = "pdf-api-service"
version = "0.1.0"
description = "API orchestrator for the PDF-Extractext microservices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "respx>=0.21,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires live extractor and document service"]

[tool.uv]
package = false
