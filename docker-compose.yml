services:
  api:
    build: .
    init: true
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      EXTRACTOR_URL: ${EXTRACTOR_URL:-http://extractor:8000}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://documents:8000}
      PORT: ${PORT:-8000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      EXTRACTOR_TIMEOUT_SECONDS: ${EXTRACTOR_TIMEOUT_SECONDS:-30}
      DOCUMENT_TIMEOUT_SECONDS: ${DOCUMENT_TIMEOUT_SECONDS:-5}
      READY_CHECK_TIMEOUT_SECONDS: ${READY_CHECK_TIMEOUT_SECONDS:-2}
      BODY_TIMEOUT_SECONDS: ${BODY_TIMEOUT_SECONDS:-30}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.http.routers.pdf-api.rule=Host(`${TRAEFIK_API_HOST:-api.universidad.localhost}`)
      - traefik.docker.network=pdf-network
      - traefik.http.routers.pdf-api.entrypoints=${TRAEFIK_ENTRYPOINT:-web}
      - traefik.http.routers.pdf-api.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.pdf-api.service=pdf-api
      - traefik.http.services.pdf-api.loadbalancer.server.port=${PORT:-8000}

networks:
  pdf-network:
    external: true
