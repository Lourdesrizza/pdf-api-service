name: ${COMPOSE_PROJECT_NAME:?Set a unique isolated project name}
services:
  mongodb:
    image: mongo:7.0.45
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks: [isolated]
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?Set a dedicated database name}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    labels:
      - "traefik.enable=false"

  documents:
    image: ${DOCUMENTS_IMAGE:?Set a unique test image tag}
    build:
      context: ${DOCUMENTS_REPO_PATH:?Set DOCUMENTS_REPO_PATH}
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks: [isolated]
    environment:
      PORT: "8000"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGO_DATABASE:?Set a dedicated database name}
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    labels:
      - "traefik.enable=false"

  extractor:
    image: ${EXTRACTOR_IMAGE:?Set a unique test image tag}
    build:
      context: ${EXTRACTOR_REPO_PATH:?Set EXTRACTOR_REPO_PATH}
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    networks: [isolated]
    environment:
      PORT: "8000"
      CACHE_ENABLED: "false"
      METRICS_ENABLED: "true"
      READINESS_REDIS_REQUIRED: "false"
      REDIS_URL: redis://cache-disabled.invalid:6379/0
      EXTRACTION_CONCURRENCY: "1"
      MAX_IN_FLIGHT: "1"
      PYTHONUNBUFFERED: "1"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    labels:
      - "traefik.enable=false"

  api:
    image: ${API_IMAGE:?Set a unique test image tag}
    build:
      context: ${API_REPO_PATH:?Set API_REPO_PATH}
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks: [isolated]
    environment:
      PORT: "8000"
      EXTRACTOR_URL: http://extractor:8000
      DOCUMENT_SERVICE_URL: http://documents:8000
      MAX_UPLOAD_BYTES: "20971520"
      EXTRACTOR_TIMEOUT_SECONDS: "30"
      DOCUMENT_TIMEOUT_SECONDS: "5"
      READY_CHECK_TIMEOUT_SECONDS: "2"
      MAX_CONCURRENT_REQUESTS: "0"
      LOG_LEVEL: INFO
    depends_on:
      extractor:
        condition: service_healthy
      documents:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    labels:
      - "traefik.enable=false"

  traefik:
    image: traefik:v3.6.25
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api=false
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [isolated]
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    labels:
      - "traefik.enable=false"

  client:
    image: ${API_IMAGE:?Set a unique test image tag}
    profiles: [client]
    entrypoint: ["python", "/tmp/verify.py"]
    volumes:
      - ./verify.py:/tmp/verify.py:ro
      - ./persistence_check.py:/tmp/persistence_check.py:ro
      - ./dependency_check.py:/tmp/dependency_check.py:ro
      - ./../../scripts/check_api.py:/tmp/check_api.py:ro
      - type: bind
        source: ${RUN_DIRECTORY:?Set RUN_DIRECTORY}/proof.pdf
        target: /fixtures/proof.pdf
        read_only: true
      - type: bind
        source: ${RUN_DIRECTORY:?Set RUN_DIRECTORY}/concurrency.pdf
        target: /fixtures/concurrency.pdf
        read_only: true
    networks: [isolated]
    labels:
      - "traefik.enable=false"

networks:
  isolated:
    internal: true
